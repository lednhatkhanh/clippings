packages:
  - apps/*
  - packages/*

catalogMode: strict

catalog:
  "@material/material-color-utilities": 0.4.0
  "@shadcn/lint": 0.2.1
  "@tailwindcss/postcss": 4.3.3
  "@types/node": 24.19.2
  "@types/pg": 8.23.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  better-auth: 1.7.10
  cn: 0.4.0
  next: 16.4.1
  oxfmt: 0.73.0
  oxlint: 1.88.0
  oxlint-tsgolint: 7.0.2004
  pg: 8.23.1
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.3
  tsx: 4.23.15
  turbo: 2.11.8
  typescript: 7.0.2
  vitest: 5.0.4
  wxt: 0.21.4

# Added by pnpm 12 because these exact versions were under the 1-day
# `minimumReleaseAge` when first installed. They are version-pinned, so they go
# inert after a bump; delete the block whenever convenient.
minimumReleaseAgeExclude:
  - "@next/env@16.4.1"
  - "@next/swc-darwin-arm64@16.4.1"
  - "@next/swc-darwin-x64@16.4.1"
  - "@next/swc-linux-arm64-gnu@16.4.1"
  - "@next/swc-linux-arm64-musl@16.4.1"
  - "@next/swc-linux-x64-gnu@16.4.1"
  - "@next/swc-linux-x64-musl@16.4.1"
  - "@next/swc-win32-arm64-msvc@16.4.1"
  - "@next/swc-win32-x64-msvc@16.4.1"
  - next@16.4.1
  - react-dom@19.3.1
  - react@19.3.1
  - "@better-auth/core@1.7.10"
  - "@better-auth/drizzle-adapter@1.7.10"
  - "@better-auth/kysely-adapter@1.7.10"
  - "@better-auth/memory-adapter@1.7.10"
  - "@better-auth/mongo-adapter@1.7.10"
  - "@better-auth/prisma-adapter@1.7.10"
  - "@better-auth/telemetry@1.7.10"
  - better-auth@1.7.10

# esbuild arrives transitively (tsx, vite). Its postinstall only validates the
# platform binary, which resolves from optional dependencies without it.
allowBuilds:
  esbuild: false
