name: backup

# Neon Free keeps 6 hours of history. This dumps the production database every night to a
# Cloudflare R2 bucket; a lifecycle rule on the bucket expires dumps after 30 days (docs/deploy.md).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The client must match the server's major version, so use the postgres:18 image.
      - name: Dump the database
        run: |
          set -euo pipefail
          docker run --rm --env DATABASE_URL_DIRECT postgres:18 \
            sh -c 'pg_dump --format=custom --no-owner --no-acl "$DATABASE_URL_DIRECT"' > clippings.dump
          test -s clippings.dump
          # A dump that can't be listed can't be restored.
          docker run --rm -i postgres:18 pg_restore --list < clippings.dump > /dev/null
          ls -l clippings.dump
        env:
          DATABASE_URL_DIRECT: ${{ secrets.PRODUCTION_DATABASE_URL_DIRECT }}

      # The AWS CLI ships on GitHub-hosted runners; R2 speaks S3.
      - name: Upload to R2
        run: |
          set -euo pipefail
          key="daily/clippings-$(date -u +%Y-%m-%d).dump"
          aws s3 cp clippings.dump "s3://$R2_BUCKET/$key" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          echo "Uploaded \`$key\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # Recent AWS CLI versions add CRC checksums by default; R2 doesn't accept them all.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
