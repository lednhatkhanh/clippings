name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A real Postgres with pgvector for the `db` package's migration and service tests.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Full history: `turbo --affected` treats every package as changed on a shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Turborepo's local cache, and Turbopack's: a build that turbo can't replay still compiles
      # only what changed (about a minute cold on a runner).
      - uses: actions/cache@v6
        with:
          path: |
            .turbo
            apps/web/.next/cache
          # Not `turbo-` alone: as a restore prefix it would also match the e2e job's keys.
          key: ${{ runner.os }}-turbo-check-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-check-

      - uses: ./.github/actions/setup

      - name: Check root files
        run: pnpm check:root

      # run-checks.mjs uses `turbo --affected`, except when a root config file changed.
      - name: Lint, format, typecheck, test, build
        run: node scripts/run-checks.mjs
        env:
          # Turborepo's remote cache on Vercel, shared by both jobs and across runs, so a task whose
          # inputs didn't change replays. Without the secret, turbo keeps to the local cache. Set
          # only on the turbo steps, so install scripts never see the token.
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          BEFORE_SHA: ${{ github.event.before }}
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      # The extension, built for the web app at the `CLIPPINGS_ORIGIN` repository variable
      # (localhost when it's unset), zipped to load unpacked or upload as an unlisted item.
      - name: Zip the extension
        run: pnpm --filter @clippings/extension zip
        env:
          CLIPPINGS_ORIGIN: ${{ vars.CLIPPINGS_ORIGIN }}

      - uses: actions/upload-artifact@v7
        with:
          name: clippings-extension
          path: apps/extension/.output/*.zip
          if-no-files-found: error
          include-hidden-files: true

  # The end-to-end suite (apps/e2e): a production build of the web app in a real browser, on the
  # same kind of Postgres. Its own job and task, so `pnpm test` stays fast and needs no browser. It
  # runs alongside `check` rather than after it: a run takes as long as the slower of the two.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # As in `check`, under its own key: the end-to-end build has its own task hash and directory,
      # and two jobs can't save one key.
      - uses: actions/cache@v6
        with:
          path: |
            .turbo
            apps/web/.next-e2e/cache
          key: ${{ runner.os }}-turbo-e2e-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-e2e-

      - uses: ./.github/actions/setup

      # No browser cache: restoring one costs about as much as downloading Chromium.
      - name: Install Chromium
        run: pnpm --filter @clippings/e2e browsers

      # `pnpm e2e` builds the web app with EXPOSE_TESTING_API=1 through Turborepo (a variable the
      # build task declares, so a normal build is never replayed for it), then runs Playwright,
      # whose global setup creates and migrates the end-to-end database. The same run builds the
      # extension for the app's end-to-end address (`pnpm e2e` sets CLIPPINGS_ORIGIN from the
      # port), which the `extension` Playwright project loads into Chromium.
      - name: End-to-end tests
        run: pnpm e2e
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/clippings_e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          if-no-files-found: ignore
