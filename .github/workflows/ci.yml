name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A real Postgres with pgvector for the `db` package's migration and service tests.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Full history: `turbo --affected` treats every package as changed on a shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No `version` input: reads `packageManager` / `devEngines.packageManager` from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile

      - name: Check root files
        run: pnpm check:root

      # run-checks.mjs uses `turbo --affected`, except when a root config file changed.
      - name: Lint, format, typecheck, test, build
        run: node scripts/run-checks.mjs
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      # The extension, built for the web app at the `CLIPPINGS_ORIGIN` repository variable
      # (localhost when it's unset), zipped to load unpacked or upload as an unlisted item.
      - name: Zip the extension
        run: pnpm --filter @clippings/extension zip
        env:
          CLIPPINGS_ORIGIN: ${{ vars.CLIPPINGS_ORIGIN }}

      - uses: actions/upload-artifact@v7
        with:
          name: clippings-extension
          path: apps/extension/.output/*.zip
          if-no-files-found: error
