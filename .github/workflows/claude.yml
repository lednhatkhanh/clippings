name: claude

# `@claude` in an issue, a pull request, a review or a review comment runs Claude Code against the
# repo. Only the owner, members and collaborators can trigger it, and the job holds no deploy or
# database secret: its one secret is the Claude token, so there is no `environment:` and nothing
# from development or production.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  claude:
    # The `if` keeps a runner from starting on a comment that isn't for Claude. The action checks
    # the trigger phrase and the actor's write access again before it does anything.
    if: >-
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One run per issue or pull request, queued rather than cancelled: a second `@claude` waits
    # for the first instead of killing it halfway through a push. Job level, so a comment that
    # skips the job never takes the slot.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # The action trades the OIDC token for a Claude GitHub App token (the default auth).
      id-token: write
      # Read CI results on a pull request.
      actions: read
    steps:
      # The default branch, not the PR's code: the action checks out the right branch itself, and
      # dependencies are installed from the lockfile that is already on `main`.
      - uses: actions/checkout@v7

      # Lets Claude run the repo's own checks (CLAUDE.md, "Checks").
      - uses: ./.github/actions/setup

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
