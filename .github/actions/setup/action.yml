name: Set up the workspace
description: Install pnpm and Node from the repo's pins, then the locked dependencies. Run after checkout.

runs:
  using: composite
  steps:
    # No `version` input: reads `packageManager` / `devEngines.packageManager` from package.json.
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
