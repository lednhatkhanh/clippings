<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clipping detail, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px">
<dc-import name="Detail" mode="{{mode}}" accent="{{accent}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"dark"},"accent":{"editor":"enum","options":["ochre","terracotta","sage","ink"],"default":"sage"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { mode: this.props.mode ?? 'dark', accent: this.props.accent ?? 'sage' };
}
}
</script>
</body>
</html>
